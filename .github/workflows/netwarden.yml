name: NetWarden CI

on:
  push:
    branches: [main]
    paths: ["netwarden/**", ".github/workflows/netwarden.yml"]
  pull_request:
    paths: ["netwarden/**", ".github/workflows/netwarden.yml"]

defaults:
  run:
    working-directory: netwarden

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: netwarden-dist
          path: netwarden/dist/
      - run: docker build -t netwarden:${{ github.sha }} .
      - run: docker run --rm netwarden:${{ github.sha }} --version
